; PlatformIO project for the ESP32-S3 Minecraft server on an N16R8
; (16 MB flash, 8 MB octal PSRAM). Chip settings live in sdkconfig.defaults.

[env:esp32s3-n16r8]
; Pin a tested ESP-IDF 5.5.3 platform line instead of drifting with "latest".
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash: 16 MB, with the custom layout in partitions.csv
; (large app slot + a 4 MB LittleFS partition for saving the world)
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
