name: ESP32-S3 Firmware and Native Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp32-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registries:
    name: Generate authentic Minecraft 1.21.8 registries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retrieve and checksum Mojang server JAR
        run: python3 scripts/fetch_minecraft_server.py

      - name: Extract and generate real registry headers and sources
        run: bash ./extract_registries.sh

      - name: Verify generated inputs
        run: |
          test -s include/registries.h
          test -s src/registries.c
          grep -q 'BlockInfo' include/registries.h
          echo "Authentic generated registry files are ready."

      - name: Share generated C registry files (not Mojang JAR)
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-registry-sources
          path: |
            include/registries.h
            src/registries.c
          if-no-files-found: error
          retention-days: 1

  host-tests:
    name: Host C tests, protocol E2E and Clang-Tidy
    needs: registries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore real registry C files
        uses: actions/download-artifact@v4
        with:
          name: minecraft-registry-sources

      - name: Configure host build and real compilation database
        run: cmake -S tests -B .ci-build/host -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Compile native server and regression tests
        run: cmake --build .ci-build/host --parallel 2

      - name: Run world, crafting and chunk-packet regression tests
        run: ctest --test-dir .ci-build/host --output-on-failure --timeout 120

      - name: Run Minecraft login and chunk-protocol end-to-end test
        run: python3 tests/run_e2e.py .ci-build/host/mcserver_native

      - name: Analyze host C using real compiler flags and generated headers
        id: linter
        uses: cpp-linter/cpp-linter-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '21'
          style: ''
          extensions: 'c'
          tidy-checks: 'bugprone-*,clang-analyzer-*,performance-*,portability-*'
          database: '.ci-build/host'
          ignore: 'tests|src/registries.c'
          files-changed-only: false
          step-summary: true
          file-annotations: true

      - name: Report static analysis baseline
        if: always()
        env:
          FINDINGS: ${{ steps.linter.outputs.clang-tidy-checks-failed }}
        run: |
          echo "### C static analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "Clang-Tidy findings: ${FINDINGS:-not available}" >> "$GITHUB_STEP_SUMMARY"
          echo "Advisory while inherited-code findings are triaged; C builds and tests are blocking." >> "$GITHUB_STEP_SUMMARY"
          echo "This compiler database covers the native configuration; ESP-only paths also need device-specific review." >> "$GITHUB_STEP_SUMMARY"

  esp32-firmware:
    name: Compile real ESP32-S3 N16R8 firmware
    needs: registries
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore real registry C files
        uses: actions/download-artifact@v4
        with:
          name: minecraft-registry-sources

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PlatformIO CLI
        run: |
          python -m pip install --disable-pip-version-check 'platformio==6.1.19'
          pio --version

      - name: Compile ESP-IDF firmware for N16R8
        run: pio run -e esp32s3-n16r8

      - name: Export target-specific compilation commands
        run: |
          pio run -e esp32s3-n16r8 -t compiledb
          test -s compile_commands.json
          python -c 'import json; d=json.load(open("compile_commands.json")); assert d, "empty ESP-IDF compilation database"; print(len(d), "compile commands")'

      - name: Upload firmware and target compilation database
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-build
          path: |
            .pio/build/esp32s3-n16r8/firmware.bin
            compile_commands.json
          if-no-files-found: error
          retention-days: 7
