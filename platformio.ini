; PlatformIO project for bareiron on an ESP32-S3 N16R8
; (16 MB flash, 8 MB octal PSRAM). Chip settings live in sdkconfig.defaults.

[env:esp32s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash: 16 MB, with the custom layout in partitions.csv
; (large app slot + a 4 MB LittleFS partition for saving the world)
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
